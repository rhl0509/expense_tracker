# 배포 구성을 로컬에서 그대로 구동해 확인하는 용도. DB 는 컨테이너에 두지 않고 외부
# (로컬 MySQL 또는 RDS)를 DB_HOST 로 가리킨다. 값은 같은 폴더 .env 에서 읽는다.
#
# 로컬 검증 시: 호스트의 MySQL 을 쓰려면 .env 에 DB_HOST=host.docker.internal 로 둔다.
# 배포 시: DB_HOST=<RDS 엔드포인트>, SESSION_COOKIE_SECURE=true, AI_ENC_KEY/DB_SSL_CA 설정.

services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      BIND_HOST: "0.0.0.0"
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AI_ENC_KEY: ${AI_ENC_KEY:-}
      DB_SSL_CA: ${DB_SSL_CA:-}
    expose:
      - "5000"
    healthcheck:
      # slim 이미지엔 curl 이 없어 python 으로 /health 를 친다. 503(DB/디스크 이상)이면 실패.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # 브라우저가 아니라 Next 서버가 백엔드로 프록시하는 주소(compose 내부 네트워크).
      BACKEND_URL: "http://backend:5000"
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"

  # 외부에 노출되는 유일한 서비스. 나머지는 내부 네트워크에만 있다.
  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
